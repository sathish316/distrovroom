categories:
  - name: setup
    items:
      - name: github-ssh-keys
        aliases: [ssh-keys, ssh keys, GitHub SSH keys]
        description: Generate an Ed25519 SSH key pair for GitHub.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install openssh-client
              - &githubSSHKeygen 'install -d -m 700 "$HOME/.ssh" && ssh-keygen -t ed25519 -C {{.email}} -f "$HOME/.ssh/id_ed25519"'
            test:
              - 'ls "$HOME"/.ssh/*.pub >/dev/null 2>&1'
          arch:
            install:
              - sudo pacman -S --needed openssh
              - *githubSSHKeygen
            test:
              - 'ls "$HOME"/.ssh/*.pub >/dev/null 2>&1'
  - name: cli-programming
    items:
      - name: github-cli
        aliases: [gh, github cli]
        description: Work with GitHub repositories, pull requests, issues, and workflows from the terminal.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install gh
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade gh
            config:
              - gh auth login
            test:
              - command -v gh
          arch:
            install:
              - sudo pacman -S --needed github-cli
            upgrade:
              - sudo pacman -Syu github-cli
            config:
              - gh auth login
            test:
              - command -v gh
  - name: programming-env
    items:
      - name: javascript
        description: Install Node.js 24 and npm with nvm.
        environments:
          default:
            install:
              - "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | bash"
              - >-
                touch "$HOME/.bashrc";
                if ! grep -Fq 'export NVM_DIR="$HOME/.nvm"' "$HOME/.bashrc"; then
                  printf '\nexport NVM_DIR="$HOME/.nvm"\n' >> "$HOME/.bashrc";
                fi;
                if ! grep -Fq '$NVM_DIR/nvm.sh' "$HOME/.bashrc"; then
                  printf '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"\n' >> "$HOME/.bashrc";
                fi
              - 'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh" && nvm install 24 && node -v && npm -v'
            test:
              - 'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh" && nvm use 24 >/dev/null && node -v && npm -v'
      - name: haskell
        description: Haskell development with Stack, GHCi, and Cabal.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install ghc cabal-install haskell-stack
            test: [command -v stack, command -v ghci, command -v cabal]
          arch:
            install: [sudo pacman -S --needed ghc cabal-install stack]
            test: [command -v stack, command -v ghci, command -v cabal]
      - name: idris
        description: Idris 1 dependently typed programming language (1.3.3).
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install ghc cabal-install haskell-stack build-essential libgmp-dev libffi-dev zlib1g-dev libtinfo6
              - 'stack --resolver lts-16.31 install idris-1.3.3 --local-bin-path "$HOME/.local/bin"'
            test: [command -v cabal, '"$HOME/.local/bin/idris" --version']
          arch:
            install: [sudo pacman -S --needed idris]
            test: [command -v idris]
      - name: rust
        description: Rust compiler and Cargo package manager via rustup.
        environments:
          default:
            install: ["curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"]
            upgrade: ['"$HOME/.cargo/bin/rustup" update']
            test: ['. "$HOME/.cargo/env" && command -v rustc && command -v cargo']
  - name: editors
    items:
      - name: zed
        description: Zed code editor.
        environments:
          default:
            install: ["curl -f https://zed.dev/install.sh | sh"]
            test: ['command -v zed || test -x "$HOME/.local/bin/zed"']
      - name: cursor
        description: Cursor AI code editor.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl gnupg
              - sudo install -d -m 0755 /etc/apt/keyrings
              - 'curl -fsSL https://downloads.cursor.com/keys/anysphere.asc | gpg --dearmor | sudo tee /etc/apt/keyrings/cursor.gpg >/dev/null'
              - 'echo "deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/cursor.gpg] https://downloads.cursor.com/aptrepo stable main" | sudo tee /etc/apt/sources.list.d/cursor.list >/dev/null'
              - sudo apt update
              - sudo apt install cursor
            upgrade: [sudo apt update, sudo apt install --only-upgrade cursor]
            test: [command -v cursor]
          arch:
            install:
              - sudo pacman -S --needed curl jq
              - >-
                case "$(uname -m)" in
                  x86_64) platform=linux-x64 ;;
                  aarch64) platform=linux-arm64 ;;
                  *) echo 'Unsupported architecture for Cursor' >&2; exit 1 ;;
                esac;
                url="$(curl -fsSL "https://api2.cursor.sh/updates/api/download/stable/$platform/cursor" | jq -er .downloadUrl)" || exit 1;
                install -d "$HOME/.local/bin";
                file="$(mktemp "$HOME/.local/bin/.cursor.XXXXXX")" || exit 1;
                trap 'rm -f "$file"' 0;
                curl -fL "$url" -o "$file" && chmod +x "$file" && mv -f "$file" "$HOME/.local/bin/cursor"
            test: ['command -v cursor || test -x "$HOME/.local/bin/cursor"']
  - name: agents
    items:
      - name: codex
        description: OpenAI Codex CLI.
        environments:
          default:
            install: [npm install -g @openai/codex@latest]
            upgrade: [npm install -g @openai/codex@latest]
            test: [command -v codex]
      - name: claude-code
        aliases: [claude code]
        description: Anthropic Claude Code CLI.
        environments:
          default:
            install: ["curl -fsSL https://claude.ai/install.sh | bash"]
            test: [command -v claude]
      - name: cursor-agent-cli
        aliases: [cursor-agent, cursor agent cli]
        description: Cursor Agent CLI.
        environments:
          default:
            install: ["curl -fsSL https://cursor.com/install | bash"]
            upgrade: [cursor-agent update]
            config: [cursor-agent login]
            test: [command -v cursor-agent]
      - name: pi
        description: Pi coding agent CLI.
        environments:
          default:
            install: ["curl -fsSL https://pi.dev/install.sh | sh"]
            upgrade: [pi update]
            test: [command -v pi]
      - name: opencode
        aliases: [open code]
        description: OpenCode terminal coding agent.
        environments:
          default:
            install: ["curl -fsSL https://opencode.ai/install | bash"]
            test: [command -v opencode]
      - name: grok-build
        aliases: [grok build]
        description: xAI Grok Build CLI.
        environments:
          default:
            install: ["curl -fsSL https://x.ai/cli/install.sh | bash"]
            upgrade: [grok update]
            config: [grok login]
            test: [command -v grok]
      - name: muse-spark
        aliases: [muse spark, muse-code]
        description: Meta Muse Code CLI powered by Muse Spark.
        environments:
          default:
            install: ["curl -fsSL https://dev.meta.ai/install.sh | bash"]
            test: [command -v muse]
  - name: personal-agents
    items:
      - name: grok-bot
        aliases: [grok bot]
        description: Grok Bot desktop app for personal AI teammates.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl jq
              - >-
                case "$(uname -m)" in
                  x86_64) platform=linux-x64 ;;
                  aarch64) platform=linux-arm64 ;;
                  *) echo 'Unsupported architecture for Grok Bot' >&2; exit 1 ;;
                esac;
                url="$(curl -fsSL "https://api2.cursor.sh/updates/api/download/stable/$platform/sand" | jq -er .debUrl)" || exit 1;
                file="$(mktemp --suffix=.deb)" || exit 1;
                trap 'rm -f "$file"' 0;
                curl -fL "$url" -o "$file" && sudo apt install "$file"
            upgrade: [sudo apt update, sudo apt install --only-upgrade grok-bot]
            test: ["dpkg-query -W -f='${Status}' grok-bot 2>/dev/null | grep -qx 'install ok installed'"]
          arch:
            install:
              - sudo pacman -S --needed curl jq
              - >-
                case "$(uname -m)" in
                  x86_64) platform=linux-x64 ;;
                  aarch64) platform=linux-arm64 ;;
                  *) echo 'Unsupported architecture for Grok Bot' >&2; exit 1 ;;
                esac;
                url="$(curl -fsSL "https://api2.cursor.sh/updates/api/download/stable/$platform/sand" | jq -er .downloadUrl)" || exit 1;
                install -d "$HOME/.local/bin";
                file="$(mktemp "$HOME/.local/bin/.grok-bot.XXXXXX")" || exit 1;
                trap 'rm -f "$file"' 0;
                curl -fL "$url" -o "$file" && chmod +x "$file" && mv -f "$file" "$HOME/.local/bin/grok-bot"
            test: ['command -v grok-bot || test -x "$HOME/.local/bin/grok-bot"']
  - name: music
    items:
      - name: spotify
        description: Spotify desktop music player.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl gnupg
              - 'curl -fsSL https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc | sudo gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/spotify.gpg'
              - 'echo "deb https://repository.spotify.com stable non-free" | sudo tee /etc/apt/sources.list.d/spotify.list >/dev/null'
              - sudo apt update
              - sudo apt install spotify-client
            upgrade: [sudo apt update, sudo apt install --only-upgrade spotify-client]
            test: [command -v spotify]
          arch:
            install: [sudo pacman -S --needed spotify-launcher]
            upgrade: [sudo pacman -Syu spotify-launcher]
            test: [command -v spotify-launcher]
  - name: productivity
    items:
      - name: obsidian
        description: Obsidian notes app, CLI, and Codex agent skills.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl jq git
              - >-
                arch="$(dpkg --print-architecture)";
                url="$(curl -fsSL 'https://api.github.com/repos/obsidianmd/obsidian-releases/releases?per_page=100' |
                  jq -er --arg suffix "_${arch}.deb" '[.[] | .assets[] | select(.name | endswith($suffix)) | .browser_download_url] | first')" || exit 1;
                file="$(mktemp --suffix=.deb)" || exit 1;
                trap 'rm -f "$file"' 0;
                curl -fL "$url" -o "$file" && sudo apt install "$file"
              - &obsidianSkills >-
                repo="$HOME/.local/share/obsidian-skills";
                if [ -d "$repo/.git" ]; then
                  git -C "$repo" pull --ff-only;
                else
                  install -d "$(dirname "$repo")" && git clone --depth 1 https://github.com/kepano/obsidian-skills.git "$repo";
                fi &&
                install -d "$HOME/.codex/skills" &&
                cp -R "$repo/skills/." "$HOME/.codex/skills/"
            config:
              - 'printf "In Obsidian, enable Settings > General > Command line interface and register the CLI.\n"'
            test:
              - command -v obsidian
              - 'test -x "$HOME/.local/bin/obsidian"'
              - 'test -f "$HOME/.codex/skills/obsidian-cli/SKILL.md"'
          arch:
            install:
              - sudo pacman -S --needed obsidian git
              - *obsidianSkills
            config:
              - 'printf "In Obsidian, enable Settings > General > Command line interface and register the CLI.\n"'
            test:
              - command -v obsidian
              - 'test -x "$HOME/.local/bin/obsidian"'
              - 'test -f "$HOME/.codex/skills/obsidian-cli/SKILL.md"'
      - name: todoist
        description: Todoist desktop app, CLI, and agent skills.
        environments:
          default:
            install:
              - sudo snap install todoist
              - npm install -g @doist/todoist-cli
              - td skill install codex
              - td skill install claude-code
              - td skill install cursor
              - td skill install pi
              - td skill install universal
            upgrade: [sudo snap refresh todoist, npm install -g @doist/todoist-cli]
            config: [td auth login]
            test:
              - test -x /snap/bin/todoist
              - command -v td
              - 'test -f "$HOME/.codex/skills/todoist-cli/SKILL.md"'
