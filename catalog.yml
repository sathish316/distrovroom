categories:
  - name: setup
    items:
      - name: github-ssh-keys
        aliases: [ssh-keys, ssh keys, GitHub SSH keys]
        description: Generate an Ed25519 SSH key pair for GitHub.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install openssh-client
              - &githubSSHKeygen 'install -d -m 700 "$HOME/.ssh" && ssh-keygen -t ed25519 -C {{.email}} -f "$HOME/.ssh/id_ed25519"'
            test:
              - 'ls "$HOME"/.ssh/*.pub >/dev/null 2>&1'
          arch:
            install:
              - sudo pacman -S --needed openssh
              - *githubSSHKeygen
            test:
              - 'ls "$HOME"/.ssh/*.pub >/dev/null 2>&1'
  - name: cli-programming
    items:
      - name: github-cli
        aliases: [gh, github cli]
        description: Work with GitHub repositories, pull requests, issues, and workflows from the terminal.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install gh
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade gh
            config:
              - gh auth login
            test:
              - command -v gh
          arch:
            install:
              - sudo pacman -S --needed github-cli
            upgrade:
              - sudo pacman -Syu github-cli
            config:
              - gh auth login
            test:
              - command -v gh
  - name: programming-env
    items:
      - name: javascript
        description: Install Node.js 24 and npm with nvm.
        environments:
          default:
            install:
              - "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | bash"
              - >-
                touch "$HOME/.bashrc";
                if ! grep -Fq 'export NVM_DIR="$HOME/.nvm"' "$HOME/.bashrc"; then
                  printf '\nexport NVM_DIR="$HOME/.nvm"\n' >> "$HOME/.bashrc";
                fi;
                if ! grep -Fq '$NVM_DIR/nvm.sh' "$HOME/.bashrc"; then
                  printf '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"\n' >> "$HOME/.bashrc";
                fi
              - 'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh" && nvm install 24 && node -v && npm -v'
            test:
              - 'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh" && nvm use 24 >/dev/null && node -v && npm -v'
  - name: agents
    items:
      - name: codex
        description: OpenAI Codex CLI.
        environments:
          default:
            install: [npm install -g @openai/codex@latest]
            upgrade: [npm install -g @openai/codex@latest]
            test: [command -v codex]
      - name: claude-code
        aliases: [claude code]
        description: Anthropic Claude Code CLI.
        environments:
          default:
            install: ["curl -fsSL https://claude.ai/install.sh | bash"]
            test: [command -v claude]
      - name: cursor-agent-cli
        aliases: [cursor-agent, cursor agent cli]
        description: Cursor Agent CLI.
        environments:
          default:
            install: ["curl -fsSL https://cursor.com/install | bash"]
            upgrade: [cursor-agent update]
            config: [cursor-agent login]
            test: [command -v cursor-agent]
      - name: pi
        description: Pi coding agent CLI.
        environments:
          default:
            install: ["curl -fsSL https://pi.dev/install.sh | sh"]
            upgrade: [pi update]
            test: [command -v pi]
      - name: opencode
        aliases: [open code]
        description: OpenCode terminal coding agent.
        environments:
          default:
            install: ["curl -fsSL https://opencode.ai/install | bash"]
            test: [command -v opencode]
      - name: grok-build
        aliases: [grok build]
        description: xAI Grok Build CLI.
        environments:
          default:
            install: ["curl -fsSL https://x.ai/cli/install.sh | bash"]
            upgrade: [grok update]
            config: [grok login]
            test: [command -v grok]
      - name: muse-spark
        aliases: [muse spark, muse-code]
        description: Meta Muse Code CLI powered by Muse Spark.
        environments:
          default:
            install: ["curl -fsSL https://dev.meta.ai/install.sh | bash"]
            test: [command -v muse]
