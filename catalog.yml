categories:
  - name: setup
    items:
      - name: github-ssh-keys
        aliases: [ssh-keys, ssh keys, GitHub SSH keys]
        description: Generate an Ed25519 SSH key pair for GitHub.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install openssh-client
              - &githubSSHKeygen 'install -d -m 700 "$HOME/.ssh" && ssh-keygen -t ed25519 -C {{.email}} -f "$HOME/.ssh/id_ed25519"'
            test:
              - 'ls "$HOME"/.ssh/*.pub >/dev/null 2>&1'
          arch:
            install:
              - sudo pacman -S --needed openssh
              - *githubSSHKeygen
            test:
              - 'ls "$HOME"/.ssh/*.pub >/dev/null 2>&1'
      - name: pkg-config
        description: Tool that reports compiler and linker flags for installed libraries.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install pkg-config
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade pkg-config
            test: [command -v pkg-config]
          arch:
            install: [sudo pacman -S --needed pkgconf]
            upgrade: [sudo pacman -Syu pkgconf]
            test: [command -v pkg-config]
      - name: libsecret-dev
        aliases: [libsecret-1-dev, libsecret]
        description: libsecret development headers for building apps that use the system keyring.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install libsecret-1-dev
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade libsecret-1-dev
            test: [dpkg -s libsecret-1-dev]
          arch:
            install: [sudo pacman -S --needed libsecret]
            upgrade: [sudo pacman -Syu libsecret]
            test: [pacman -Q libsecret]
  - name: cli-programming
    items:
      - name: github-cli
        aliases: [gh, github cli]
        description: Work with GitHub repositories, pull requests, issues, and workflows from the terminal.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install gh
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade gh
            config:
              - gh auth login
            test:
              - command -v gh
          arch:
            install:
              - sudo pacman -S --needed github-cli
            upgrade:
              - sudo pacman -Syu github-cli
            config:
              - gh auth login
            test:
              - command -v gh
  - name: programming-env
    items:
      - name: javascript
        description: Install Node.js 24 and npm with nvm.
        environments:
          default:
            install:
              - "curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | bash"
              - >-
                touch "$HOME/.bashrc";
                if ! grep -Fq 'export NVM_DIR="$HOME/.nvm"' "$HOME/.bashrc"; then
                  printf '\nexport NVM_DIR="$HOME/.nvm"\n' >> "$HOME/.bashrc";
                fi;
                if ! grep -Fq '$NVM_DIR/nvm.sh' "$HOME/.bashrc"; then
                  printf '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"\n' >> "$HOME/.bashrc";
                fi
              - 'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh" && nvm install 24 && node -v && npm -v'
            test:
              - 'export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh" && nvm use 24 >/dev/null && node -v && npm -v'
      - name: haskell
        description: Haskell development with Stack, GHCi, and Cabal.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install ghc cabal-install haskell-stack
            test: [command -v stack, command -v ghci, command -v cabal]
          arch:
            install: [sudo pacman -S --needed ghc cabal-install stack]
            test: [command -v stack, command -v ghci, command -v cabal]
      - name: idris
        description: Idris 1 dependently typed programming language (1.3.3).
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install ghc cabal-install haskell-stack build-essential libgmp-dev libffi-dev zlib1g-dev libtinfo6
              - 'stack --resolver lts-16.31 install idris-1.3.3 --local-bin-path "$HOME/.local/bin"'
            test: [command -v cabal, '"$HOME/.local/bin/idris" --version']
          arch:
            install: [sudo pacman -S --needed idris]
            test: [command -v idris]
      - name: rust
        description: Rust compiler and Cargo package manager via rustup.
        environments:
          default:
            install: ["curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"]
            upgrade: ['"$HOME/.cargo/bin/rustup" update']
            test: ['. "$HOME/.cargo/env" && command -v rustc && command -v cargo']
  - name: programming-frameworks
    items:
      - name: vite
        description: Vite frontend build tool and dev server.
        environments:
          default:
            install: [npm install -g vite@latest]
            upgrade: [npm install -g vite@latest]
            test: [command -v vite]
      - name: vite-plus
        aliases: [vp, vite+]
        description: Vite+ unified web toolchain and the global vp CLI.
        environments:
          default:
            install: ["curl -fsSL https://vite.plus | bash"]
            upgrade: [vp upgrade]
            test: ['command -v vp || test -x "$HOME/.vite-plus/bin/vp"']
  - name: editors
    items:
      - name: zed
        description: Zed code editor.
        environments:
          default:
            install: ["curl -f https://zed.dev/install.sh | sh"]
            test: ['command -v zed || test -x "$HOME/.local/bin/zed"']
      - name: cursor
        description: Cursor AI code editor.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl gnupg
              - sudo install -d -m 0755 /etc/apt/keyrings
              - 'curl -fsSL https://downloads.cursor.com/keys/anysphere.asc | gpg --dearmor | sudo tee /etc/apt/keyrings/cursor.gpg >/dev/null'
              - 'echo "deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/cursor.gpg] https://downloads.cursor.com/aptrepo stable main" | sudo tee /etc/apt/sources.list.d/cursor.list >/dev/null'
              - sudo apt update
              - sudo apt install cursor
            upgrade: [sudo apt update, sudo apt install --only-upgrade cursor]
            test: [command -v cursor]
          arch:
            install:
              - sudo pacman -S --needed curl jq
              - >-
                case "$(uname -m)" in
                  x86_64) platform=linux-x64 ;;
                  aarch64) platform=linux-arm64 ;;
                  *) echo 'Unsupported architecture for Cursor' >&2; exit 1 ;;
                esac;
                url="$(curl -fsSL "https://api2.cursor.sh/updates/api/download/stable/$platform/cursor" | jq -er .downloadUrl)" || exit 1;
                install -d "$HOME/.local/bin";
                file="$(mktemp "$HOME/.local/bin/.cursor.XXXXXX")" || exit 1;
                trap 'rm -f "$file"' 0;
                curl -fL "$url" -o "$file" && chmod +x "$file" && mv -f "$file" "$HOME/.local/bin/cursor"
            test: ['command -v cursor || test -x "$HOME/.local/bin/cursor"']
      - name: neovim
        description: Neovim modal text editor.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install neovim
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade neovim
            test: [command -v nvim]
          arch:
            install: [sudo pacman -S --needed neovim]
            upgrade: [sudo pacman -Syu neovim]
            test: [command -v nvim]
          macos:
            install: [brew install neovim]
            upgrade: [brew upgrade neovim]
            test: [command -v nvim]
  - name: browsers
    items:
      - name: google-chrome
        description: Google Chrome web browser.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl
              - >-
                file="$(mktemp --suffix=.deb)" || exit 1;
                trap 'rm -f "$file"' 0;
                curl -fL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$file" && sudo apt install "$file"
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade google-chrome-stable
            test: ['command -v google-chrome-stable || command -v google-chrome']
          arch:
            install:
              - sudo pacman -S --needed base-devel git
              - >-
                if command -v yay >/dev/null; then yay -S --needed google-chrome;
                elif command -v paru >/dev/null; then paru -S --needed google-chrome;
                else
                  dir="$(mktemp -d)" || exit 1;
                  trap 'rm -rf "$dir"' 0;
                  git clone https://aur.archlinux.org/google-chrome.git "$dir/google-chrome" &&
                  (cd "$dir/google-chrome" && makepkg -si);
                fi
            test: ['command -v google-chrome-stable || command -v google-chrome']
  - name: terminals
    items:
      - name: ghostty
        description: Ghostty GPU-accelerated terminal emulator.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl
              - '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh)"'
            upgrade:
              - '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh)"'
            test: [command -v ghostty]
          arch:
            install: [sudo pacman -S --needed ghostty]
            upgrade: [sudo pacman -Syu ghostty]
            test: [command -v ghostty]
          macos:
            install: [brew install --cask ghostty]
            upgrade: [brew upgrade --cask ghostty]
            test: ['test -d /Applications/Ghostty.app || test -d "$HOME/Applications/Ghostty.app"']
  - name: terminal-multiplexer
    items:
      - name: tmux
        description: Terminal multiplexer for persistent sessions and split panes.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install tmux
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade tmux
            test: [command -v tmux]
          arch:
            install: [sudo pacman -S --needed tmux]
            upgrade: [sudo pacman -Syu tmux]
            test: [command -v tmux]
      - name: herdr
        description: Agent-aware terminal multiplexer with workspaces, tabs, and panes.
        environments:
          default:
            install: ["curl -fsSL https://herdr.dev/install.sh | sh"]
            upgrade: [herdr update]
            test: [command -v herdr]
      - name: cmux
        description: Native macOS terminal with workspaces, split panes, and agent notifications.
        environments:
          macos:
            install:
              - brew tap manaflow-ai/cmux
              - brew install --cask cmux
            upgrade: [brew upgrade --cask cmux]
            test: ['test -d /Applications/cmux.app || test -d "$HOME/Applications/cmux.app"']
  - name: terminal-utils
    items:
      - name: chafa
        description: Terminal image viewer that renders images and animations as text graphics.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install chafa
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade chafa
            test: [command -v chafa]
          arch:
            install: [sudo pacman -S --needed chafa]
            upgrade: [sudo pacman -Syu chafa]
            test: [command -v chafa]
      - name: wl-clipboard
        description: Wayland clipboard utilities (wl-copy and wl-paste).
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install wl-clipboard
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade wl-clipboard
            test: [command -v wl-copy]
          arch:
            install: [sudo pacman -S --needed wl-clipboard]
            upgrade: [sudo pacman -Syu wl-clipboard]
            test: [command -v wl-copy]
      - name: tree
        description: Directory listing tool that prints folders as an indented tree.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install tree
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade tree
            test: [command -v tree]
          arch:
            install: [sudo pacman -S --needed tree]
            upgrade: [sudo pacman -Syu tree]
            test: [command -v tree]
          macos:
            install: [brew install tree]
            upgrade: [brew upgrade tree]
            test: [command -v tree]
  - name: agents
    items:
      - name: codex
        description: OpenAI Codex CLI.
        environments:
          default:
            install: [npm install -g @openai/codex@latest]
            upgrade: [npm install -g @openai/codex@latest]
            test: [command -v codex]
      - name: claude-code
        aliases: [claude code]
        description: Anthropic Claude Code CLI.
        environments:
          default:
            install: ["curl -fsSL https://claude.ai/install.sh | bash"]
            test: [command -v claude]
      - name: claude-agent-acp
        description: ACP adapter that lets editors such as Zed run Claude through the Claude Agent SDK.
        environments:
          default:
            install: [npm install -g @agentclientprotocol/claude-agent-acp@latest]
            upgrade: [npm install -g @agentclientprotocol/claude-agent-acp@latest]
            test: [command -v claude-agent-acp]
      - name: codex-acp
        description: ACP adapter that lets editors such as Zed run Codex.
        environments:
          default:
            install: [npm install -g @agentclientprotocol/codex-acp@latest]
            upgrade: [npm install -g @agentclientprotocol/codex-acp@latest]
            test: [command -v codex-acp]
      - name: pi-acp
        description: ACP adapter that lets editors such as Zed run the Pi coding agent.
        environments:
          default:
            install: [npm install -g pi-acp@latest]
            upgrade: [npm install -g pi-acp@latest]
            test: [command -v pi-acp]
      - name: cursor-agent-cli
        aliases: [cursor-agent, cursor agent cli]
        description: Cursor Agent CLI.
        environments:
          default:
            install: ["curl -fsSL https://cursor.com/install | bash"]
            upgrade: [cursor-agent update]
            config: [cursor-agent login]
            test: [command -v cursor-agent]
      - name: pi
        description: Pi coding agent CLI.
        environments:
          default:
            install: ["curl -fsSL https://pi.dev/install.sh | sh"]
            upgrade: [pi update]
            test: [command -v pi]
      - name: opencode
        aliases: [open code]
        description: OpenCode terminal coding agent.
        environments:
          default:
            install: ["curl -fsSL https://opencode.ai/install | bash"]
            test: [command -v opencode]
      - name: grok-build
        aliases: [grok build]
        description: xAI Grok Build CLI.
        environments:
          default:
            install: ["curl -fsSL https://x.ai/cli/install.sh | bash"]
            upgrade: [grok update]
            config: [grok login]
            test: [command -v grok]
      - name: muse-spark
        aliases: [muse spark, muse-code]
        description: Meta Muse Code CLI powered by Muse Spark.
        environments:
          default:
            install: ["curl -fsSL https://dev.meta.ai/install.sh | bash"]
            test: [command -v muse]
      - name: fx
        description: fx tiny, open, native coding agent from Vercel Labs.
        environments:
          default:
            install: ["curl -fsSL https://fx.sh/setup.sh | bash"]
            upgrade: [fx upgrade]
            test: ['command -v fx || test -x "$HOME/.local/bin/fx"']
  - name: personal-agents
    items:
      - name: grok-bot
        aliases: [grok bot]
        description: Grok Bot desktop app for personal AI teammates.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl jq
              - >-
                case "$(uname -m)" in
                  x86_64) platform=linux-x64 ;;
                  aarch64) platform=linux-arm64 ;;
                  *) echo 'Unsupported architecture for Grok Bot' >&2; exit 1 ;;
                esac;
                url="$(curl -fsSL "https://api2.cursor.sh/updates/api/download/stable/$platform/sand" | jq -er .debUrl)" || exit 1;
                file="$(mktemp --suffix=.deb)" || exit 1;
                trap 'rm -f "$file"' 0;
                curl -fL "$url" -o "$file" && sudo apt install "$file"
            upgrade: [sudo apt update, sudo apt install --only-upgrade grok-bot]
            test: ["dpkg-query -W -f='${Status}' grok-bot 2>/dev/null | grep -qx 'install ok installed'"]
          arch:
            install:
              - sudo pacman -S --needed curl jq
              - >-
                case "$(uname -m)" in
                  x86_64) platform=linux-x64 ;;
                  aarch64) platform=linux-arm64 ;;
                  *) echo 'Unsupported architecture for Grok Bot' >&2; exit 1 ;;
                esac;
                url="$(curl -fsSL "https://api2.cursor.sh/updates/api/download/stable/$platform/sand" | jq -er .downloadUrl)" || exit 1;
                install -d "$HOME/.local/bin";
                file="$(mktemp "$HOME/.local/bin/.grok-bot.XXXXXX")" || exit 1;
                trap 'rm -f "$file"' 0;
                curl -fL "$url" -o "$file" && chmod +x "$file" && mv -f "$file" "$HOME/.local/bin/grok-bot"
            test: ['command -v grok-bot || test -x "$HOME/.local/bin/grok-bot"']
  - name: music
    items:
      - name: spotify
        description: Spotify desktop music player.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl gnupg
              - 'curl -fsSL https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc | sudo gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/spotify.gpg'
              - 'echo "deb https://repository.spotify.com stable non-free" | sudo tee /etc/apt/sources.list.d/spotify.list >/dev/null'
              - sudo apt update
              - sudo apt install spotify-client
            upgrade: [sudo apt update, sudo apt install --only-upgrade spotify-client]
            test: [command -v spotify]
          arch:
            install: [sudo pacman -S --needed spotify-launcher]
            upgrade: [sudo pacman -Syu spotify-launcher]
            test: [command -v spotify-launcher]
  - name: productivity
    items:
      - name: obsidian
        description: Obsidian notes app, CLI, and Codex agent skills.
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install curl jq git
              - >-
                arch="$(dpkg --print-architecture)";
                url="$(curl -fsSL 'https://api.github.com/repos/obsidianmd/obsidian-releases/releases?per_page=100' |
                  jq -er --arg suffix "_${arch}.deb" '[.[] | .assets[] | select(.name | endswith($suffix)) | .browser_download_url] | first')" || exit 1;
                file="$(mktemp --suffix=.deb)" || exit 1;
                trap 'rm -f "$file"' 0;
                curl -fL "$url" -o "$file" && sudo apt install "$file"
              - &obsidianSkills >-
                repo="$HOME/.local/share/obsidian-skills";
                if [ -d "$repo/.git" ]; then
                  git -C "$repo" pull --ff-only;
                else
                  install -d "$(dirname "$repo")" && git clone --depth 1 https://github.com/kepano/obsidian-skills.git "$repo";
                fi &&
                install -d "$HOME/.codex/skills" &&
                cp -R "$repo/skills/." "$HOME/.codex/skills/"
            config:
              - 'printf "In Obsidian, enable Settings > General > Command line interface and register the CLI.\n"'
            test:
              - 'command -v obsidian || test -x "$HOME/.local/bin/obsidian"'
              - 'test -f "$HOME/.codex/skills/obsidian-cli/SKILL.md"'
          arch:
            install:
              - sudo pacman -S --needed obsidian git
              - *obsidianSkills
            config:
              - 'printf "In Obsidian, enable Settings > General > Command line interface and register the CLI.\n"'
            test:
              - 'command -v obsidian || test -x "$HOME/.local/bin/obsidian"'
              - 'test -f "$HOME/.codex/skills/obsidian-cli/SKILL.md"'
      - name: todoist
        description: Todoist desktop app, CLI, and agent skills.
        environments:
          default:
            install:
              - sudo snap install todoist
              - npm install -g @doist/todoist-cli
              - td skill install codex
              - td skill install claude-code
              - td skill install cursor
              - td skill install pi
              - td skill install universal
            upgrade: [sudo snap refresh todoist, npm install -g @doist/todoist-cli]
            config: [td auth login]
            test:
              - test -x /snap/bin/todoist
              - command -v td
              - 'test -f "$HOME/.codex/skills/todoist-cli/SKILL.md"'
