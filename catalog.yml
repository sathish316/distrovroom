categories:
  - name: setup
    items:
      - name: ssh-keys
        aliases: [ssh keys]
        description: Generate an SSH key for services such as GitHub.
        check:
          ssh-key: true
        environments:
          default:
            install:
              - ssh-keygen -t ed25519 -C "your_email@example.com"
            test:
              - ls ~/.ssh/*.pub
  - name: cli-programming
    items:
      - name: github-cli
        aliases: [gh, github cli]
        description: Work with GitHub repositories, pull requests, issues, and workflows from the terminal.
        check:
          binary: gh
        environments:
          debian:
            install:
              - sudo apt update
              - sudo apt install gh
            upgrade:
              - sudo apt update
              - sudo apt install --only-upgrade gh
            config:
              - gh auth login
            test:
              - gh --version
          arch:
            install:
              - sudo pacman -S --needed github-cli
            upgrade:
              - sudo pacman -Syu github-cli
            config:
              - gh auth login
            test:
              - gh --version
  - name: agents
    items:
      - name: codex
        description: OpenAI Codex CLI.
        check:
          binary: codex
        environments:
          default:
            install: [npm install -g @openai/codex@latest]
            upgrade: [npm install -g @openai/codex@latest]
            test: [codex --version]
      - name: claude-code
        aliases: [claude code]
        description: Anthropic Claude Code CLI.
        check:
          binary: claude
        environments:
          default:
            install: ["curl -fsSL https://claude.ai/install.sh | bash"]
            test: [claude --version]
      - name: cursor-agent-cli
        aliases: [cursor-agent, cursor agent cli]
        description: Cursor Agent CLI.
        check:
          binary: cursor-agent
        environments:
          default:
            install: ["curl -fsSL https://cursor.com/install | bash"]
            upgrade: [cursor-agent update]
            config: [cursor-agent login]
            test: [cursor-agent --version]
      - name: pi
        description: Pi coding agent CLI.
        check:
          binary: pi
        environments:
          default:
            install: ["curl -fsSL https://pi.dev/install.sh | sh"]
            upgrade: [pi update]
            test: [pi --version]
      - name: opencode
        aliases: [open code]
        description: OpenCode terminal coding agent.
        check:
          binary: opencode
        environments:
          default:
            install: ["curl -fsSL https://opencode.ai/install | bash"]
            test: [opencode --version]
      - name: grok-build
        aliases: [grok build]
        description: xAI Grok Build CLI.
        check:
          binary: grok
        environments:
          default:
            install: ["curl -fsSL https://x.ai/cli/install.sh | bash"]
            upgrade: [grok update]
            config: [grok login]
            test: [grok version]
      - name: muse-spark
        aliases: [muse spark, muse-code]
        description: Meta Muse Code CLI powered by Muse Spark.
        check:
          binary: muse
        environments:
          default:
            install: ["curl -fsSL https://dev.meta.ai/install.sh | sh"]
            test: [muse --version]
